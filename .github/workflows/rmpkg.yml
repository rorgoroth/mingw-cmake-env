name: rmpkgprefix
on:
  workflow_dispatch:
    inputs:
      pkgname:
        required: true

jobs:
  rmpkgprefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: check_pkgname
        env:
          PKGNAME: ${{ github.event.inputs.pkgname }}
        run: |
          case "$PKGNAME" in
            ''|*[!A-Za-z0-9._+-]*) echo "Invalid package name" >&2; exit 1 ;;
          esac
          printf '%s\n' "$PKGNAME" > .rmpkg-name

      - name: setup_alpine
        uses: rorgoroth/setup-alpine@develop

      - name: load_cache_build
        uses: actions/cache/restore@main
        with:
          path: build
          key: cached_build

      - name: load_cache_ltocache
        uses: actions/cache/restore@main
        with:
          path: build/install/x86_64-w64-mingw32/ltocache
          key: ltocache

      - name: load_cache_ccache
        uses: actions/cache/restore@main
        with:
          path: build/install/x86_64-w64-mingw32/ccache
          key: ccache

      - name: run_clean_dist
        run: sh run.sh rmpkg "$(cat .rmpkg-name)"
        shell: alpine.sh {0}

      - name: clear_cache
        uses: easimon/wipe-cache@main

      - name: save_cache_ltocache
        uses: actions/cache/save@main
        with:
          path: build/install/x86_64-w64-mingw32/ltocache
          key: ltocache

      - name: save_cache_ccache
        uses: actions/cache/save@main
        with:
          path: build/install/x86_64-w64-mingw32/ccache
          key: ccache

      - name: save_cache_build
        uses: actions/cache/save@main
        with:
          path: build
          key: cached_build
